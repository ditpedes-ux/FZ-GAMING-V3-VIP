
name: Build FZ GAMING V3 VIP

on:
  workflow_dispatch:
  push:
    paths:
      - "FZ_GAMING_V3_VIP_source.zip"
      - ".github/workflows/android-build.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extract project
        run: |
          unzip -o FZ_GAMING_V3_VIP_source.zip -d .
          test -f FZ_GAMING_V3_VIP/app/build.gradle.kts

      - name: Build APK
        working-directory: FZ_GAMING_V3_VIP
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FZ-GAMING-V3-VIP-debug-apk
          path: FZ_GAMING_V3_VIP/app/build/outputs/apk/debug/app-debug.apk
